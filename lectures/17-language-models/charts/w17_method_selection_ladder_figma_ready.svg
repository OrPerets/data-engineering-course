<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="90" y="90" font-family="Inter, Arial" font-size="44" font-weight="800" fill="#172033">Method selection ladder</text>
  <text x="92" y="130" font-family="Inter, Arial" font-size="22" fill="#637083">Start with the smallest representation that answers the operational question</text>
  <g font-family="Inter, Arial">
    <rect x="90" y="210" width="310" height="420" rx="24" fill="#FFFFFF" stroke="#2F5BEA" stroke-width="5"/>
    <rect x="445" y="170" width="310" height="460" rx="24" fill="#FFFFFF" stroke="#00A7A5" stroke-width="5"/>
    <rect x="800" y="130" width="310" height="500" rx="24" fill="#FFFFFF" stroke="#F5A524" stroke-width="5"/>
    <rect x="1155" y="90" width="310" height="540" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="5"/>
    <text x="125" y="285" font-size="32" font-weight="800" fill="#2F5BEA">TF-IDF</text>
    <text x="480" y="245" font-size="32" font-weight="800" fill="#00A7A5">N-grams</text>
    <text x="835" y="205" font-size="32" font-weight="800" fill="#F5A524">Embeddings</text>
    <text x="1190" y="165" font-size="32" font-weight="800" fill="#7C3AED">Transformer LM</text>
    <text x="125" y="350" font-size="23" fill="#172033">Rare terms</text>
    <text x="125" y="390" font-size="23" fill="#172033">Interpretable</text>
    <text x="125" y="430" font-size="23" fill="#172033">Sparse features</text>
    <text x="480" y="310" font-size="23" fill="#172033">Local order</text>
    <text x="480" y="350" font-size="23" fill="#172033">Negation</text>
    <text x="480" y="390" font-size="23" fill="#172033">Phrase signals</text>
    <text x="835" y="270" font-size="23" fill="#172033">Meaning distance</text>
    <text x="835" y="310" font-size="23" fill="#172033">Semantic search</text>
    <text x="835" y="350" font-size="23" fill="#172033">Dense vectors</text>
    <text x="1190" y="230" font-size="23" fill="#172033">Generation</text>
    <text x="1190" y="270" font-size="23" fill="#172033">Instruction following</text>
    <text x="1190" y="310" font-size="23" fill="#172033">High cost/risk</text>
    <path d="M400 420 C430 420 420 420 445 420" stroke="#637083" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M755 400 C785 400 775 390 800 390" stroke="#637083" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M1110 370 C1140 370 1130 360 1155 350" stroke="#637083" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#637083"/>
    </marker>
  </defs>
  <text x="90" y="770" font-family="Inter, Arial" font-size="24" font-weight="700" fill="#172033">Engineering rule:</text>
  <text x="315" y="770" font-family="Inter, Arial" font-size="24" fill="#637083">upgrade only when the added cost buys measurable decision quality.</text>
</svg>
